# Build, test and deploy to Cloudflare Workers + Static Assets on every push to
# main. GitHub stays the source of truth; nobody deploys by hand.
# Required repo secrets: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit +
# Account:Read + Zone:Workers Routes:Edit for the zone), CLOUDFLARE_ACCOUNT_ID.
name: deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install xmllint (feed test)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
      - name: Voice gate (changed posts first published here)
        run: |
          # House style: no em dash, no AI filler words, TL;DR 2-4 items, one Basically line per section.
          # Posts with original_url are imports and keep their text as is.
          base="${{ github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then base=HEAD~1; fi
          fail=0
          for f in $(git diff --name-only --diff-filter=AM "$base" HEAD -- 'content/posts/**/*.md'); do
            grep -q '^original_url:' "$f" && continue
            # Machine translations (plugins/translate.py) are checked against their source, not the house style.
            grep -q '^translated_from:' "$f" && continue
            python3 plugins/check_draft.py "$f" || fail=1
          done
          exit $fail
      - name: Test build (with synthetic fixtures) and engine tests
        run: npm run build:test && npm test
      - name: Production build
        run: npm run build
      - name: Origin parity check (Node server, all verify scripts)
        run: |
          node server.mjs & sleep 2
          npm run verify:all
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Generate content graph for the Worker bundle
        run: npm run content
      - name: Deploy Worker + assets
        # wrangler-action@v3 defaults to Wrangler 3, which does not read wrangler.jsonc.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4 deploy --var GIT_SHA:${{ github.sha }}
      - name: Smoke test
        run: |
          sleep 5
          curl -fsS https://emin.de/health
          curl -fsS -H 'Accept: text/markdown' https://emin.de/ | head -3
      - name: IndexNow ping for changed posts
        run: node plugins/indexnow.mjs --since ${{ github.event.before }} || true
