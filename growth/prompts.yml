# Monitored AI prompts for emin.de and nuri.com. Read by growth/ai-visibility.mjs.
# Format kept flat on purpose (parsed without a YAML library): one "- " item per
# prompt with id, lang, topic, prompt. Add prompts at the bottom; never reuse an id.
# Runs WEEKLY, only when an engine is enabled in growth/ai-visibility.config.json
# AND its key exists. Every engine call is paid: all engines default OFF (needs Emin OK).
